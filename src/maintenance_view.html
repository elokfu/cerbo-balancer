<template>
  <div class="maintenance" v-if="msg?.payload">
    <div class="title-row"><div><h2>Dyness RS485 telemetry</h2><span class="subtle">Updated {{ msg.payload.age }} ago · {{ msg.payload.port }} · {{ msg.payload.baud }} baud</span></div><span class="badge" :class="msg.payload.displayState === 'LIVE' ? 'good' : msg.payload.displayState === 'STALE' ? 'stale' : 'bad'">{{ msg.payload.displayState }}</span></div>
    <div v-if="msg.payload.displayState !== 'LIVE'" class="communication-warning"><strong>{{ msg.payload.displayState === 'STALE' ? 'STALE MEASUREMENTS' : 'NO LIVE MEASUREMENTS' }}</strong><span v-if="msg.payload.displayState === 'STALE'">Last valid sample {{ Math.round(msg.payload.displayAgeMs / 1000) }} s ago.</span><span v-if="msg.payload.reason">{{ msg.payload.reason }}</span><span>Serial: {{ msg.payload.serialHealth.state }} · owner conflict: {{ msg.payload.serialHealth.ownerConflict ? 'yes' : 'no' }} · reconnects: {{ msg.payload.serialHealth.reconnectCount }}</span></div>
    <div class="inventory" :class="msg.payload.inventory.pendingRemoval.length ? 'recovery' : 'normal'"><strong>Inventory</strong><span class="inventory-item">Active: {{ msg.payload.inventory.activeAddresses.join(', ') || 'none' }}</span><span class="inventory-item">Discovery: {{ msg.payload.inventory.mode }} every {{ msg.payload.inventory.scanIntervalSeconds }} s</span><span v-if="msg.payload.inventory.nextDiscoveryInSeconds != null" class="inventory-item">Next scan: {{ msg.payload.inventory.nextDiscoveryInSeconds }} s</span><span v-for="item in msg.payload.inventory.pendingRemoval" :key="item.address" class="pending inventory-item">Battery {{ item.address }} missing — retry {{ item.missedScans }}/{{ item.maxAttempts }}</span></div>
    <div class="cards"><div class="card"><span>System voltage</span><strong>{{ msg.payload.system.voltage }} V</strong><small>CID2 61</small></div><div class="card"><span>State of charge</span><strong>{{ msg.payload.system.soc }} %</strong><small>CID2 61</small></div><div class="card"><span>Vmin / Vmax</span><strong>{{ msg.payload.aggregate.vmin }} / {{ msg.payload.aggregate.vmax }} V</strong><small>All packs spread {{ msg.payload.aggregate.spread }} mV</small></div><div class="card"><span>Battery current</span><strong>{{ msg.payload.aggregate.current }} A</strong><small>{{ msg.payload.aggregate.temperature }}</small></div></div>
    <section><h3>Limits, BMS status, and serial health</h3><table><tbody><tr><th>Charge voltage</th><td>{{ msg.payload.limits.chargeVoltage }} V</td><th>Discharge voltage</th><td>{{ msg.payload.limits.dischargeVoltage }} V</td></tr><tr><th>CCL</th><td>{{ msg.payload.limits.ccl }} A</td><th>DCL</th><td>{{ msg.payload.limits.dcl }} A</td></tr><tr><th>Status byte</th><td>{{ msg.payload.limits.status }} · {{ msg.payload.limits.statusSeverity }}</td><th>Responding</th><td>{{ msg.payload.discovery.count }} ({{ msg.payload.discovery.addresses }})</td></tr><tr><th>Vmin location</th><td>{{ msg.payload.aggregate.min }}</td><th>Vmax location</th><td>{{ msg.payload.aggregate.max }}</td></tr><tr><th>Serial state</th><td>{{ msg.payload.serialHealth.state }}</td><th>Owner conflict</th><td>{{ msg.payload.serialHealth.ownerConflict ? 'YES' : 'no' }}</td></tr><tr><th>Reconnects</th><td>{{ msg.payload.serialHealth.reconnectCount }}</td><th>Last error</th><td>{{ msg.payload.serialHealth.lastError }}</td></tr></tbody></table><div class="status-flags"><strong>BMS warnings and protections</strong><span v-if="!msg.payload.limits.statusActive.length" class="flag normal">No active warnings</span><span v-for="flag in msg.payload.limits.statusActive" :key="flag" class="flag warning">{{ flag }}</span></div></section>
    <section v-for="b in msg.payload.batteries" :key="b.address" class="battery"><div class="battery-head"><h3>Battery {{ b.address }}</h3><span class="badge" :class="b.valid ? 'good' : 'bad'">{{ b.valid ? 'VALID' : 'INVALID' }}</span></div><div class="battery-meta"><span><b>{{ b.voltage }} V</b> voltage</span><span><b>{{ b.current }} A</b> current</span><span><b>{{ b.cellSpread }} V</b> cell spread</span><span><b>{{ b.delta }} mV</b> vs system</span><span><b>{{ b.minimumTemperature }}–{{ b.maximumTemperature }} °C</b> temperature</span></div><h4>Cell voltages</h4><div class="cells"><div v-for="c in b.cells" :key="c.index" class="cell"><span>Cell {{ String(c.index).padStart(2, '0') }}</span><b>{{ c.voltage }} V</b></div></div><h4>Temperatures</h4><div class="temps"><span v-for="t in b.temperatures" :key="t.index">T{{ t.index }}: <b>{{ t.value }} °C</b></span></div><div class="subtle">Reported sum {{ b.reportedSum }} V · reconstructed {{ b.reconstructedSum }} V · difference {{ b.voltageDelta }} mV · {{ b.errors.length ? b.errors.join('; ') : 'no validation errors' }}</div></section>
    <div v-if="!msg.payload.batteries.length" class="waiting">No active battery telemetry. Discovery is continuing according to the inventory state above.</div>
  </div><div v-else class="waiting">Waiting for RS485 telemetry…</div>
</template>
<style>
.maintenance { color: var(--v-theme-on-surface); font-size: 14px; } .title-row,.battery-head { display:flex; justify-content:space-between; align-items:center; gap:12px; } h2,h3,h4 { margin: 0 0 8px; } h3 { margin-top: 4px; } h4 { margin-top: 14px; font-size: 13px; } .subtle,small { color: rgba(0,0,0,.62); font-size: 12px; } .communication-warning { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:9px 12px; margin:12px 0; border-radius:8px; color:#8b4d00; background:#fff1d6; } .inventory { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:9px 12px; margin:12px 0; border-radius:8px; background:#eef4f8; } .inventory-item { display:inline-block; margin-right:8px; white-space:nowrap; } .inventory.recovery { background:#fff1d6; } .inventory .pending { color:#9a5c00; font-weight:600; } .status-flags { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; } .flag { padding:4px 8px; border-radius:999px; font-size:12px; } .flag.normal { color:#176b35; background:#d9f4df; } .flag.warning { color:#9d2727; background:#f9dddd; } .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; } .card,section { border:1px solid rgba(0,0,0,.12); border-radius:8px; padding:12px; background:rgba(255,255,255,.55); } .card { display:flex; flex-direction:column; gap:4px; } .card strong { font-size:20px; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:7px 8px; border-bottom:1px solid rgba(0,0,0,.1); } th { font-weight:600; width:18%; } .battery { margin-top:12px; } .battery-meta,.temps { display:flex; flex-wrap:wrap; gap:14px; margin:8px 0; } .cells { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:6px; } .cell { display:flex; flex-direction:column; gap:2px; padding:7px; border-radius:6px; background:rgba(0,0,0,.04); } .cell b { font-size:16px; } .badge { border-radius:999px; padding:4px 9px; font-size:11px; font-weight:700; background:#ddd; } .badge.good { color:#176b35; background:#d9f4df; } .badge.stale { color:#8b4d00; background:#ffe3aa; } .badge.bad { color:#9d2727; background:#f9dddd; } .waiting { padding:16px; }
</style>
