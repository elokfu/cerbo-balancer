<template>
  <div class="maintenance" v-if="msg?.payload">
    <div class="title-row"><div><h2>Dyness RS485 telemetry</h2><span class="subtle">Updated {{ msg.payload.age }} ago · {{ msg.payload.port }} · {{ msg.payload.baud }} baud</span></div><span class="badge" :class="msg.payload.displayState === 'LIVE' ? 'good' : msg.payload.displayState === 'STALE' ? 'stale' : 'bad'">{{ msg.payload.displayState }}</span></div>
    <div v-if="msg.payload.displayState !== 'LIVE'" class="communication-warning"><strong>{{ msg.payload.displayState === 'STALE' ? 'STALE MEASUREMENTS' : 'NO LIVE MEASUREMENTS' }}</strong><span v-if="msg.payload.displayState === 'STALE'">Last valid sample {{ Math.round(msg.payload.displayAgeMs / 1000) }} s ago.</span><span v-if="msg.payload.reason">{{ msg.payload.reason }}</span><span>Serial: {{ msg.payload.serialHealth.state }} · owner conflict: {{ msg.payload.serialHealth.ownerConflict ? 'yes' : 'no' }} · reconnects: {{ msg.payload.serialHealth.reconnectCount }}</span></div>
    <div class="inventory" :class="msg.payload.inventory.pendingRemoval.length ? 'recovery' : 'normal'"><strong>Inventory</strong><span class="inventory-item">Active: {{ msg.payload.inventory.activeAddresses.join(', ') || 'none' }}</span><span class="inventory-item">Discovery: {{ msg.payload.inventory.mode }} every {{ msg.payload.inventory.scanIntervalSeconds }} s</span><span v-if="msg.payload.inventory.nextDiscoveryInSeconds != null" class="inventory-item">Next scan: {{ msg.payload.inventory.nextDiscoveryInSeconds }} s</span><span v-for="item in msg.payload.inventory.pendingRemoval" :key="item.address" class="pending inventory-item">Battery {{ item.address }} missing — retry {{ item.missedScans }}/{{ item.maxAttempts }}</span></div>
    <div class="cards"><div class="card"><span>System voltage</span><strong>{{ msg.payload.system.voltage }} V</strong><small>CID2 61</small></div><div class="card"><span>State of charge</span><strong>{{ msg.payload.system.soc }} %</strong><small>CID2 61</small></div><div class="card"><span>System BMS temperature</span><strong v-if="msg.payload.system.bmsTemperature.single">{{ msg.payload.system.bmsTemperature.single.value }} °C</strong><strong v-else>{{ msg.payload.system.bmsTemperature.average }} °C</strong><small v-if="msg.payload.system.bmsTemperature.single">ID {{ msg.payload.system.bmsTemperature.single.id }} · CID2 61</small><small v-else>Range {{ msg.payload.system.bmsTemperature.minimum }}–{{ msg.payload.system.bmsTemperature.maximum }} °C · CID2 61</small></div><div class="card"><span>Vmin / Vmax</span><strong>{{ msg.payload.aggregate.vmin }} / {{ msg.payload.aggregate.vmax }} V</strong><small>All packs spread {{ msg.payload.aggregate.spread }} mV</small></div><div class="card"><span>Battery current</span><strong>{{ msg.payload.aggregate.current }} A</strong><small>{{ msg.payload.aggregate.temperature }}</small></div></div>
    <section class="system-summary"><h3>CID2 61 System Summary</h3><div class="summary-grid"><div><h4>Electrical</h4><table><tbody><tr><th>System voltage</th><td>{{ msg.payload.system.voltage }} V</td></tr><tr><th>System current</th><td>{{ msg.payload.system.current }} A</td></tr><tr><th>SOC</th><td>{{ msg.payload.system.soc }} %</td></tr></tbody></table></div><div><h4>Health</h4><table><tbody><tr><th>Average cycles</th><td>{{ msg.payload.system.averageCycleCount }}</td></tr><tr><th>Maximum cycles</th><td>{{ msg.payload.system.maximumCycleCount }}</td></tr><tr><th>Average SOH</th><td>{{ msg.payload.system.averageSoh }} %</td></tr><tr><th>Minimum SOH</th><td>{{ msg.payload.system.minimumSoh }} %</td></tr></tbody></table></div><div><h4>Cell summary</h4><table><tbody><tr><th>Maximum cell</th><td>{{ msg.payload.system.cellSummary.maximumVoltage }} V · ID {{ msg.payload.system.cellSummary.maximumId }}</td></tr><tr><th>Minimum cell</th><td>{{ msg.payload.system.cellSummary.minimumVoltage }} V · ID {{ msg.payload.system.cellSummary.minimumId }}</td></tr><tr><th>Cell spread</th><td>{{ msg.payload.system.cellSummary.spread }} V</td></tr></tbody></table></div><div><h4>Cell temperature</h4><table><tbody><tr><th>Average</th><td>{{ msg.payload.system.cellTemperature.average }} °C</td></tr><tr><th>Maximum</th><td>{{ msg.payload.system.cellTemperature.maximum }} °C · ID {{ msg.payload.system.cellTemperature.maximumId }}</td></tr><tr><th>Minimum</th><td>{{ msg.payload.system.cellTemperature.minimum }} °C · ID {{ msg.payload.system.cellTemperature.minimumId }}</td></tr></tbody></table></div><div><h4>MOSFET temperature</h4><table><tbody><tr><th>Average</th><td>{{ msg.payload.system.mosfetTemperature.average }} °C</td></tr><tr><th>Maximum</th><td>{{ msg.payload.system.mosfetTemperature.maximum }} °C · ID {{ msg.payload.system.mosfetTemperature.maximumId }}</td></tr><tr><th>Minimum</th><td>{{ msg.payload.system.mosfetTemperature.minimum }} °C · ID {{ msg.payload.system.mosfetTemperature.minimumId }}</td></tr></tbody></table></div><div class="bms-summary"><h4>BMS temperature</h4><div v-if="msg.payload.system.bmsTemperature.single" class="single-temperature"><strong>{{ msg.payload.system.bmsTemperature.single.value }} °C</strong><span>ID {{ msg.payload.system.bmsTemperature.single.id }}</span></div><table v-else><tbody><tr><th>Average</th><td>{{ msg.payload.system.bmsTemperature.average }} °C</td></tr><tr><th>Maximum</th><td>{{ msg.payload.system.bmsTemperature.maximum }} °C · ID {{ msg.payload.system.bmsTemperature.maximumId }}</td></tr><tr><th>Minimum</th><td>{{ msg.payload.system.bmsTemperature.minimum }} °C · ID {{ msg.payload.system.bmsTemperature.minimumId }}</td></tr></tbody></table></div></div><div class="subtle source-note">System summary source: CID2 61 · invalid or sentinel values are shown as —.</div></section>
    <section><h3>Limits, BMS permissions, and serial health</h3><table><tbody><tr><th>Charge voltage</th><td>{{ msg.payload.limits.chargeVoltage }} V</td><th>Discharge voltage</th><td>{{ msg.payload.limits.dischargeVoltage }} V</td></tr><tr><th>CCL</th><td>{{ msg.payload.limits.ccl }} A</td><th>DCL</th><td>{{ msg.payload.limits.dcl }} A</td></tr><tr><th>Status byte</th><td>{{ msg.payload.limits.status }} · {{ msg.payload.limits.statusState }}</td><th>Responding</th><td>{{ msg.payload.discovery.count }} ({{ msg.payload.discovery.addresses }})</td></tr><tr><th>Charge permission</th><td>{{ msg.payload.limits.statusFlags.chargeEnabled === true ? 'enabled' : msg.payload.limits.statusFlags.chargeEnabled === false ? 'disabled' : '—' }}</td><th>Discharge permission</th><td>{{ msg.payload.limits.statusFlags.dischargeEnabled === true ? 'enabled' : msg.payload.limits.statusFlags.dischargeEnabled === false ? 'disabled' : '—' }}</td></tr><tr><th>Strong charge</th><td>{{ msg.payload.limits.statusFlags.strongCharge === true ? 'yes' : msg.payload.limits.statusFlags.strongCharge === false ? 'no' : '—' }}</td><th>Full charge</th><td>{{ msg.payload.limits.statusFlags.fullCharge === true ? 'yes' : msg.payload.limits.statusFlags.fullCharge === false ? 'no' : '—' }}</td></tr><tr><th>Vmin location</th><td>{{ msg.payload.aggregate.min }}</td><th>Vmax location</th><td>{{ msg.payload.aggregate.max }}</td></tr><tr><th>Serial state</th><td>{{ msg.payload.serialHealth.state }}</td><th>Owner conflict</th><td>{{ msg.payload.serialHealth.ownerConflict ? 'YES' : 'no' }}</td></tr><tr><th>Reconnects</th><td>{{ msg.payload.serialHealth.reconnectCount }}</td><th>Last error</th><td>{{ msg.payload.serialHealth.lastError }}</td></tr></tbody></table><div class="status-flags"><strong>Enabled state bits</strong><span v-if="!msg.payload.limits.statusActive.length" class="flag normal">No enabled state bits</span><span v-for="flag in msg.payload.limits.statusActive" :key="flag" class="flag normal">{{ flag }}</span><span v-if="msg.payload.limits.statusFlags.unknownReservedBits" class="flag warning">Unknown/reserved bits: 0x{{ msg.payload.limits.statusFlags.unknownReservedHex.slice(2) }}</span></div></section>
    <section v-for="b in msg.payload.batteries" :key="b.address" class="battery"><div class="battery-head"><h3>Battery {{ b.address }}</h3><span class="badge" :class="b.valid ? 'good' : 'bad'">{{ b.valid ? 'VALID' : 'INVALID' }}</span></div><div class="battery-meta"><span><b>{{ b.voltage }} V</b> voltage</span><span><b>{{ b.current }} A</b> current</span><span><b>{{ b.cellSpread }} V</b> cell spread</span><span><b>{{ b.delta }} mV</b> vs system</span><span><b>{{ b.minimumTemperature }}–{{ b.maximumTemperature }} °C</b> temperature</span></div><div class="status44"><div class="status44-row"><span class="status44-label">CID2 0x44</span><span class="status-badge" :class="'status-' + b.status44.stateClass">{{ b.status44.state }}</span><span v-for="chip in b.status44.chips" :key="chip.label" class="status-chip" :class="'status-' + chip.tone"><b>{{ chip.label }}</b> {{ chip.value }}</span></div><div class="subtle status-raw">{{ b.status44.raw }}<span v-if="!b.status44.available"> · {{ b.status44.error }}</span></div><details v-if="b.status44.available" class="status-details"><summary>Status flags and alarms</summary><table class="status-table"><thead><tr><th>Register</th><th>Flag</th><th>State</th></tr></thead><tbody><tr v-for="item in b.status44.flags" :key="item.register + item.label"><td>{{ item.register }}</td><td>{{ item.label }}</td><td><span class="status-badge" :class="'status-' + item.tone">{{ item.value }}</span></td></tr></tbody></table></details></div><h4>Cell voltages</h4><div class="cells"><div v-for="c in b.cells" :key="c.index" class="cell"><span>Cell {{ String(c.index).padStart(2, '0') }}</span><b>{{ c.voltage }} V</b></div></div><h4>Temperatures</h4><div class="temps"><span v-for="t in b.temperatures" :key="t.index">T{{ t.index }}: <b>{{ t.value }} °C</b></span></div><div class="subtle">Reported sum {{ b.reportedSum }} V · reconstructed {{ b.reconstructedSum }} V · difference {{ b.voltageDelta }} mV · {{ b.errors.length ? b.errors.join('; ') : 'no validation errors' }}</div></section>
    <div v-if="!msg.payload.batteries.length" class="waiting">No active battery telemetry. Discovery is continuing according to the inventory state above.</div>
  </div><div v-else class="waiting">Waiting for RS485 telemetry…</div>
</template>
<style>
.maintenance { color: var(--v-theme-on-surface); font-size: 14px; } .title-row,.battery-head { display:flex; justify-content:space-between; align-items:center; gap:12px; } h2,h3,h4 { margin: 0 0 8px; } h3 { margin-top: 4px; } h4 { margin-top: 14px; font-size: 13px; } .subtle,small { color: rgba(0,0,0,.62); font-size: 12px; } .communication-warning { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:9px 12px; margin:12px 0; border-radius:8px; color:#8b4d00; background:#fff1d6; } .inventory { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:9px 12px; margin:12px 0; border-radius:8px; background:#eef4f8; } .inventory-item { display:inline-block; margin-right:8px; white-space:nowrap; } .inventory.recovery { background:#fff1d6; } .inventory .pending { color:#9a5c00; font-weight:600; } .status-flags { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px; } .flag { padding:4px 8px; border-radius:999px; font-size:12px; } .flag.normal { color:#176b35; background:#d9f4df; } .flag.warning { color:#9d2727; background:#f9dddd; } .summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; } .summary-grid > div { padding:10px; border-radius:7px; background:rgba(0,0,0,.025); } .summary-grid h4 { margin-top:0; } .bms-summary { border:2px solid #9ac7e8; background:#eef7ff !important; } .single-temperature { display:flex; align-items:baseline; gap:10px; font-size:20px; } .single-temperature span { font-size:12px; color:rgba(0,0,0,.62); } .source-note { margin-top:10px; } .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:14px 0; } .card,section { border:1px solid rgba(0,0,0,.12); border-radius:8px; padding:12px; background:rgba(255,255,255,.55); } .card { display:flex; flex-direction:column; gap:4px; } .card strong { font-size:20px; } table { width:100%; border-collapse:collapse; } th,td { text-align:left; padding:7px 8px; border-bottom:1px solid rgba(0,0,0,.1); } th { font-weight:600; width:18%; } .battery { margin-top:12px; } .battery-meta,.temps { display:flex; flex-wrap:wrap; gap:14px; margin:8px 0; } .status44 { margin:8px 0 12px; padding:7px 9px; border-radius:7px; background:rgba(0,0,0,.025); } .status44-row { display:flex; flex-wrap:wrap; align-items:center; gap:6px; } .status44-label { font-weight:700; margin-right:3px; } .status-badge,.status-chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:3px 7px; font-size:11px; white-space:nowrap; } .status-good { color:#176b35; background:#d9f4df; } .status-warning { color:#8b4d00; background:#ffe3aa; } .status-bad { color:#9d2727; background:#f9dddd; } .status-neutral { color:rgba(0,0,0,.62); background:rgba(0,0,0,.08); } .status-raw { margin-top:5px; } .status-details { margin-top:5px; font-size:12px; } .status-details summary { cursor:pointer; color:rgba(0,0,0,.72); } .status-table { margin-top:8px; } .status-table th,.status-table td { padding:4px 6px; } .status-table th { width:auto; } .status-table td:last-child { width:78px; } .status-detail-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:6px 12px; margin-top:8px; } .status-detail-grid div { display:flex; flex-direction:column; gap:2px; } .status-detail-grid span { color:rgba(0,0,0,.7); } .cells { display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:6px; } .cell { display:flex; flex-direction:column; gap:2px; padding:7px; border-radius:6px; background:rgba(0,0,0,.04); } .cell b { font-size:16px; } .badge { border-radius:999px; padding:4px 9px; font-size:11px; font-weight:700; background:#ddd; } .badge.good { color:#176b35; background:#d9f4df; } .badge.stale { color:#8b4d00; background:#ffe3aa; } .badge.bad { color:#9d2727; background:#f9dddd; } .waiting { padding:16px; }
</style>
