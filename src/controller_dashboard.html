<template>
  <div class="controller" v-if="msg?.payload">
    <div class="head"><div><h2>Active-balancing support</h2><p v-if="!msg.payload.virtualBmsSelected">BMS source: {{ msg.payload.activeBms?.label || 'unknown' }} · ACTIVE unavailable until the virtual BMS is selected in Cerbo.</p><p v-else> BMS source: RS485 virtual BMS active · TEST calculates conservative values; ACTIVE balancing remains a separate commissioning gate.</p></div><span class="badge" :class="msg.payload.enabled ? 'good' : 'neutral'">Controller {{ msg.payload.mode }} · {{ msg.payload.enabled ? 'ENABLED' : 'DISABLED' }}</span></div>
    <div class="cards">
      <div class="card"><span>State</span><b>{{ msg.payload.state }}</b><small>{{ msg.payload.lastStopReason || 'No stop reason' }}</small></div>
      <div class="card"><span>Selected battery</span><b>{{ msg.payload.selectedAddress ?? '—' }}</b><small>{{ msg.payload.selectedReason || 'No selection' }}</small></div>
      <div class="card"><span>SOC gate</span><b>{{ msg.payload.socEntryEligible ? 'ENTRY YES' : 'ENTRY NO' }}</b><small>Continue: {{ msg.payload.socContinuationEligible ? 'YES' : 'NO' }}</small></div>
      <div class="card"><span>Aggregate command</span><b>{{ number(msg.payload.aggregateCurrentCommand, 1) }} A</b><small>Charge {{ msg.payload.lastCommand?.chargeEnabled ? 'enabled' : 'inhibited' }}</small></div>
      <div class="card"><span>Active BMS source</span><b>{{ msg.payload.activeBms?.source === 'virtual' ? 'RS485 virtual BMS' : msg.payload.activeBms?.source === 'can' ? 'CAN Dyness BMS' : 'Unknown' }}</b><small>Instance {{ msg.payload.activeBms?.activeBmsInstance ?? '—' }}</small></div>
      <div class="card"><span>Controller mode</span><b>{{ msg.payload.mode }}</b><small>{{ msg.payload.virtualBmsSelected ? 'ACTIVE available after commissioning' : 'ACTIVE unavailable' }}</small></div>
    </div>
    <div class="notice" v-if="msg.payload.lockout || msg.payload.fault">{{ msg.payload.fault || msg.payload.lockout }}</div>

    <section><h3>Balancer support</h3><div class="grid"><div>Selected current <b>{{ number(msg.payload.selectedCurrent, 2) }} A</b></div><div>Target / useful <b>{{ number(msg.payload.config.balanceBatteryCurrentTarget, 1) }} / {{ number(msg.payload.config.balancerMinimumCurrent, 1) }} A</b></div><div>Selected spread <b>{{ mv(msg.payload.selectedSpread) }}</b></div><div>Likely active <b>{{ msg.payload.balancerLikelyActive ? 'YES' : 'NO' }}</b></div><div>Cycle <b>{{ msg.payload.cycleCount }}</b></div><div>Reason <b>{{ msg.payload.lastCommand?.reason || '—' }}</b></div></div></section>
    <section><h3>Active BMS selection</h3><div class="grid"><div>Source <b>{{ msg.payload.activeBms?.label || 'Unknown' }}</b></div><div>Battery service <b>{{ msg.payload.activeBms?.activeBatteryService || '—' }}</b></div><div>BMS service <b>{{ msg.payload.activeBms?.activeBmsService || '—' }}</b></div><div>DeviceInstance <b>{{ msg.payload.activeBms?.activeBmsInstance ?? '—' }}</b></div></div><small>Select the source manually in Cerbo: Settings → System Setup → Batteries → Battery monitor.</small></section>

    <section><h3>Virtual BMS / DVCC arbitration</h3><div class="grid"><div>Requested CVL <b>{{ number(msg.payload.virtualBms?.requestedVoltage, 2) }} V</b></div><div>Effective CVL <b>{{ number(msg.payload.virtualBms?.effectiveChargeVoltage, 2) }} V</b></div><div>BMS CVL <b>{{ number(msg.payload.virtualBms?.bmsChargeVoltage, 2) }} V</b></div><div>Requested CCL <b>{{ number(msg.payload.virtualBms?.requestedCurrent, 2) }} A</b></div><div>Effective CCL <b>{{ number(msg.payload.virtualBms?.effectiveChargeCurrent, 2) }} A</b></div><div>BMS CCL <b>{{ number(msg.payload.virtualBms?.bmsChargeCurrent, 2) }} A</b></div><div>Effective DCL <b>{{ number(msg.payload.virtualBms?.effectiveDischargeCurrent, 2) }} A</b></div><div>Requested charge <b>{{ msg.payload.virtualBms?.controllerChargeEnabled == null ? '—' : (msg.payload.virtualBms.controllerChargeEnabled ? 'ENABLED' : 'INHIBITED') }}</b></div><div>Effective charge <b>{{ msg.payload.virtualBms?.effectiveChargeEnabled == null ? '—' : (msg.payload.virtualBms.effectiveChargeEnabled ? 'ENABLED' : 'INHIBITED') }}</b></div><div>Effective discharge <b>{{ msg.payload.virtualBms?.effectiveDischargeEnabled == null ? '—' : (msg.payload.virtualBms.effectiveDischargeEnabled ? 'ENABLED' : 'INHIBITED') }}</b></div><div>Thermal factor <b>{{ number(msg.payload.virtualBms?.thermalFactor, 3) }}</b></div><div>Command age <b>{{ seconds(msg.payload.virtualBms?.commandAgeMs) }}</b></div><div>Freshness <b>{{ msg.payload.virtualBms?.commandFresh == null ? '—' : (msg.payload.virtualBms.commandFresh ? 'FRESH' : 'STALE') }}</b></div></div><p class="arbitration-reason">{{ msg.payload.virtualBms?.reason || 'No virtual-BMS output' }} · {{ msg.payload.virtualBms?.mode || '—' }} / TEST shadow</p></section>

    <section><h3>Live graphs</h3><div class="charts"><div><h4>Battery current</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line current" :points="points('batteryCurrent', 0, Math.max(3, msg.payload.config.balanceBatteryCurrentTarget + 1))"/><polyline class="line selected" :points="points('selectedCurrent', 0, Math.max(3, msg.payload.config.balanceBatteryCurrentTarget + 1))"/><line class="target" x1="0" :y1="y(msg.payload.config.balanceBatteryCurrentTarget, 0, Math.max(3, msg.payload.config.balanceBatteryCurrentTarget + 1))" x2="300" :y2="y(msg.payload.config.balanceBatteryCurrentTarget, 0, Math.max(3, msg.payload.config.balanceBatteryCurrentTarget + 1))"/></svg><small>Blue: pack current · orange: selected battery · dashed: target</small></div><div><h4>Global Vmax / Vmin</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line vmax" :points="points('globalVmax', 3.2, 3.65)"/><polyline class="line vmin" :points="points('globalVmin', 3.2, 3.65)"/><line class="target" x1="0" :y1="y(msg.payload.config.selectedVmaxStop, 3.2, 3.65)" x2="300" :y2="y(msg.payload.config.selectedVmaxStop, 3.2, 3.65)"/></svg><small>Red: global Vmax · green: global Vmin · dashed: stop</small></div><div><h4>All-pack spread</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line spread" :points="points('globalSpread', 0, 0.08)"/><line class="target" x1="0" :y1="y(msg.payload.config.balancerSpreadThreshold, 0, 0.08)" x2="300" :y2="y(msg.payload.config.balancerSpreadThreshold, 0, 0.08)"/></svg><small>Purple: global spread · dashed: start</small></div></div></section>

    <section><h3>Controls</h3><p>Safety constraints remain enforced in AUTO and MANUAL modes.</p><div class="buttons"><v-btn size="small" color="primary" @click="sendControl('set_enabled', true)">Enable</v-btn><v-btn size="small" @click="sendControl('set_enabled', false)">Disable</v-btn><v-btn size="small" @click="sendControl('manual_start')">Start balancing</v-btn><v-btn size="small" @click="sendControl('manual_stop')">Stop balancing</v-btn><v-btn size="small" @click="sendControl('reset_integrator')">Reset PI</v-btn><v-btn size="small" @click="sendControl('set_auto_manual', 'AUTO')">AUTO</v-btn><v-btn size="small" @click="sendControl('set_auto_manual', 'MANUAL')">MANUAL</v-btn></div></section>
    <section><h3>CSV logging</h3><div class="buttons"><v-btn size="small" :color="msg.payload.csvLogging?.enabled ? 'error' : 'primary'" @click="toggleCsv">{{ msg.payload.csvLogging?.enabled ? 'Stop CSV logging' : 'Start CSV logging' }}</v-btn></div><small>{{ msg.payload.csvLogging?.enabled ? `Writing ${msg.payload.csvLogging.filename}` : 'Writes valid six-second telemetry samples only.' }}</small></section>

    <section><h3>Configuration</h3><p>Apply stores validated values in the controller state and configuration files. Settings alone do not enable ACTIVE balancing; Cerbo BMS selection and controller commissioning remain separate.</p><div class="form"><label>SOC entry %<input type="number" step="0.1" v-model.number="cfg.socEntryThreshold"></label><label>SOC exit %<input type="number" step="0.1" v-model.number="cfg.socExitThreshold"></label><label>Start spread mV<input type="number" step="1" :value="mvNumber(cfg.balancerSpreadThreshold)" @input="cfg.balancerSpreadThreshold=Number($event.target.value)/1000"></label><label>Current target A<input type="number" step="0.1" v-model.number="cfg.balanceBatteryCurrentTarget"></label><label>Useful current A<input type="number" step="0.1" v-model.number="cfg.balancerMinimumCurrent"></label><label>Vmax stop V<input type="number" step="0.001" v-model.number="cfg.selectedVmaxStop"></label><label>Balancing ceiling V<input type="number" step="0.1" v-model.number="cfg.balancingVoltageCeiling"></label><label>Normal ceiling V<input type="number" step="0.1" v-model.number="cfg.normalPackVoltageMax"></label><label>Kp<input type="number" step="0.01" v-model.number="cfg.kp"></label><label>Ki<input type="number" step="0.001" v-model.number="cfg.ki"></label><label>Aggregate max A<input type="number" step="1" v-model.number="cfg.aggregateCurrentMaximum"></label><label>Recovery timeout h<input type="number" step="0.5" :value="hours(cfg.maximumDischargeRecoveryMs)" @input="cfg.maximumDischargeRecoveryMs=Number($event.target.value)*3600000"></label></div><v-btn size="small" color="primary" @click="applyConfig">Validate and apply</v-btn></section>
  </div>
</template>
<script>
export default {
  data () { return { cfg: {} } },
  watch: { msg: { immediate: true, deep: true, handler (value) { if (value?.payload?.config) this.cfg = { ...value.payload.config } } } },
  methods: {
    number (value, digits = 2) { return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : '—' },
    seconds (value) { return typeof value === 'number' && Number.isFinite(value) ? `${(value / 1000).toFixed(1)} s` : '—' },
    mv (value) { return typeof value === 'number' && Number.isFinite(value) ? `${(value * 1000).toFixed(1)} mV` : '—' },
    mvNumber (value) { return typeof value === 'number' && Number.isFinite(value) ? (value * 1000).toFixed(1) : '' },
    hours (value) { return typeof value === 'number' && Number.isFinite(value) ? (value / 3600000).toFixed(1) : '' },
    history () { return Array.isArray(this.msg?.payload?.history) ? this.msg.payload.history : [] },
    y (value, min, max) { const ratio = Math.max(0, Math.min(1, (value - min) / (max - min))); return 100 - ratio * 100 },
    points (field, min, max, factor = 1) { const values = this.history(); if (!values.length) return ''; const denominator = Math.max(1, values.length - 1); return values.map((item, index) => { const value = item[field]; return typeof value === 'number' && Number.isFinite(value) ? `${(index / denominator) * 300},${this.y(value * factor, min, max)}` : null }).filter(Boolean).join(' ') },
    sendControl (type, value) { const payload = { type }; if (value !== undefined) payload.value = value; this.send({ topic: 'controller_control', payload }) },
    applyConfig () { this.send({ topic: 'controller_control', payload: { type: 'configure', config: this.cfg } }) }
    ,toggleCsv () { const active = this.msg?.payload?.csvLogging?.enabled; if (active) return this.send({ topic: 'controller_control', payload: { type: 'set_csv_logging', value: false } }); const suggested = `dyness-balancer-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.csv`; const filename = window.prompt('CSV filename', suggested); if (filename) this.send({ topic: 'controller_control', payload: { type: 'set_csv_logging', value: true, filename } }) }
  }
}
</script>
<style>
.controller{font-size:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2,.controller h3,.controller h4{margin:0 0 8px}.head p,.controller p,small{margin:0;color:rgba(0,0,0,.65)}.badge{border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}.good{background:#d9f4df;color:#176b35}.neutral{background:#e5e5e5;color:#555}.cards,.charts,.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}.card,section{border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:12px;background:rgba(255,255,255,.55)}.card{display:flex;flex-direction:column;gap:4px}.card b{font-size:18px}.notice{margin:12px 0;padding:10px;border-radius:6px;background:#fff1cf;color:#6b4e00}.grid,.buttons{display:flex;flex-wrap:wrap;gap:10px}.grid>div{padding:7px;background:rgba(0,0,0,.04);border-radius:5px}.arbitration-reason{margin-top:10px;color:#6b4e00}.charts>div{min-width:0}.charts svg{width:100%;height:120px;background:#fbfbfb;border:1px solid #ddd}.line{fill:none;stroke-width:2}.current{stroke:#1976d2}.vmax{stroke:#d32f2f}.vmin{stroke:#2e7d32}.spread{stroke:#7b1fa2}.target{stroke:#777;stroke-dasharray:5 4;stroke-width:1}.form label{display:flex;flex-direction:column;gap:4px;font-weight:600}.form input{border:1px solid #aaa;border-radius:4px;padding:6px;background:white}.buttons{margin-top:8px}
</style>
