<template>
  <div class="controller" v-if="msg?.payload">
    <div class="head"><div><h2>Dyness balancing controller</h2><p>{{ msg.payload.activeBms?.label || 'BMS source unknown' }} · physical authority is selected manually in Cerbo.</p></div><span class="badge" :class="msg.payload.state === 'SAFETY_STOP' ? 'bad' : msg.payload.authorityState === 'APPLIED' ? 'good' : 'neutral'">{{ msg.payload.authorityState }} · {{ msg.payload.state }}</span></div>
    <div class="cards">
      <div class="card"><span>Selected battery</span><b>{{ msg.payload.selectedAddress ?? '—' }}</b><small>{{ msg.payload.selectedReason || 'No selection' }}</small></div>
      <div class="card"><span>Selected SOC</span><b>{{ integer(msg.payload.selectedSoc) }} %</b><small>Addressed CID2 61 integer</small></div>
      <div class="card"><span>Selected Vmin / Vmax</span><b>{{ number(msg.payload.selectedVmin, 3) }} / {{ number(msg.payload.selectedVmax, 3) }} V</b><small>Spread {{ mv(msg.payload.selectedSpread) }} · addressed CID2 61</small></div>
      <div class="card"><span>Selected current</span><b>{{ number(msg.payload.selectedCurrent, 2) }} A</b><small>Target {{ number(msg.payload.config.balanceBatteryCurrentTarget, 2) }} A</small></div>
      <div class="card"><span>Positive total current</span><b>{{ number(msg.payload.positiveTotalCurrent, 2) }} A</b><small>No equal-sharing assumption</small></div>
      <div class="card"><span>Aggregate request</span><b>{{ number(msg.payload.aggregateCurrentCommand, 2) }} A</b><small>{{ msg.payload.lastCommand?.reason || '—' }}</small></div>
      <div class="card"><span>Automatic balancing</span><b>{{ msg.payload.automaticBalancingEnabled ? 'ON' : 'OFF' }}</b><small>{{ msg.payload.automaticBalancingEnabled ? 'Automatic battery selection enabled' : 'NORMAL Cerbo charge policy only' }}</small></div>
      <div class="card"><span>Full-SOC completion</span><b>{{ msg.payload.completionLatched ? 'LATCHED' : 'ARMED' }}</b><small>Permission OFF observed: {{ msg.payload.permissionOffSeen ? 'yes' : 'no' }}</small></div>
      <div class="card"><span>Solar limitation</span><b>{{ msg.payload.solarLimited ? 'PAUSED' : 'CLEAR' }}</b><small>Enter {{ msg.payload.solarDeficitSamples }}/{{ msg.payload.config.solarDetectionSamples }} · recover {{ msg.payload.solarRecoverySamples }}/{{ msg.payload.config.solarDetectionSamples }}</small></div>
      <div class="card"><span>Dynamic float voltage</span><b>{{ number(msg.payload.floatControl?.voltage, 3) }} V</b><small>{{ msg.payload.floatControl?.qualified ? 'QUALIFIED' : 'LEARNING' }} · {{ msg.payload.floatControl?.samples }}/{{ msg.payload.floatControl?.required }} samples · {{ msg.payload.floatControl?.active ? 'ACTIVE' : 'standby' }}</small></div>
      <div class="card"><span>Balancer qualification</span><b>{{ msg.payload.state === 'BALANCING' ? `${msg.payload.exitQualification?.samples}/${msg.payload.exitQualification?.required} exit` : 'ENTRY' }}</b><small>{{ entryProgress(msg.payload.entryQualification) }}</small></div>
      <div class="card"><span>Normal SOC current cap</span><b>{{ number(msg.payload.normalCurrentPolicy?.socCap, 0) }} A</b><small>Limit source {{ msg.payload.normalCurrentPolicy?.source || '—' }}</small></div>
    </div>
    <div class="notice" v-if="msg.payload.lockout || msg.payload.fault">{{ msg.payload.fault || msg.payload.lockout }}</div>

    <section><h3>Feed-forward and slow PI</h3><div class="grid"><div>Raw selected share <b>{{ percent(msg.payload.rawSelectedShare) }}</b></div><div>Filtered share <b>{{ percent(msg.payload.filteredSelectedShare) }}</b></div><div>Unscaled feed-forward <b>{{ number(msg.payload.feedForwardCurrent, 2) }} A</b></div><div>Feed-forward gain <b>{{ number(msg.payload.config.feedForwardGain, 3) }}</b></div><div>Effective feed-forward <b>{{ number(msg.payload.effectiveFeedForwardCurrent, 2) }} A</b></div><div>P term <b>{{ number(msg.payload.pTerm, 3) }} A</b></div><div>I term <b>{{ number(msg.payload.iTerm, 3) }} A</b></div><div>Output saturated <b>{{ msg.payload.lastCommand?.outputSaturated ? 'YES' : 'NO' }}</b></div><div>Slew limited <b>{{ msg.payload.lastCommand?.outputSlewLimited ? 'YES' : 'NO' }}</b></div><div>Effective CCL <b>{{ number(msg.payload.virtualBms?.effectiveChargeCurrent, 2) }} A</b></div><div>Effective discharging <b>{{ msg.payload.selectedEffectiveDischarging ? 'ON' : 'OFF' }}</b></div></div></section>

    <section><h3>Virtual BMS / DVCC arbitration</h3><div class="grid"><div>Authority <b>{{ msg.payload.authorityState }}</b></div><div>Controller request applied <b>{{ msg.payload.controllerRequestApplied ? 'YES' : 'NO' }}</b></div><div>Cerbo UI maximum CVL <b>{{ number(msg.payload.chargeControlSettings?.maxChargeVoltage, 2) }} V</b></div><div>Cerbo UI maximum CCL <b>{{ number(msg.payload.chargeControlSettings?.maxChargeCurrent, 2) }} A</b></div><div>Requested CVL <b>{{ number(msg.payload.virtualBms?.requestedVoltage, 2) }} V</b></div><div>Effective CVL <b>{{ number(msg.payload.virtualBms?.effectiveChargeVoltage, 2) }} V</b></div><div>BMS CVL <b>{{ number(msg.payload.virtualBms?.bmsChargeVoltage, 2) }} V</b></div><div>Requested CCL <b>{{ number(msg.payload.virtualBms?.requestedCurrent, 2) }} A</b></div><div>Effective CCL <b>{{ number(msg.payload.virtualBms?.effectiveChargeCurrent, 2) }} A</b></div><div>BMS CCL <b>{{ number(msg.payload.virtualBms?.bmsChargeCurrent, 2) }} A</b></div><div>Thermal factor <b>{{ number(msg.payload.virtualBms?.thermalFactor, 3) }}</b></div><div>Charge permission <b>{{ msg.payload.virtualBms?.statusFlags?.chargeEnabled === true ? 'ON' : msg.payload.virtualBms?.statusFlags?.chargeEnabled === false ? 'OFF' : '—' }}</b></div></div><p>{{ msg.payload.virtualBms?.reason || 'No arbitration output' }} · {{ msg.payload.authorityState }} authority · normal limits follow Cerbo Charge Control</p></section>

    <section><h3>Dynamic float and qualification</h3><div class="grid"><div>Learned/default float <b>{{ number(msg.payload.floatControl?.voltage, 3) }} V</b></div><div>Float state <b>{{ msg.payload.floatControl?.qualified ? 'QUALIFIED' : 'LEARNING' }}</b></div><div>Float samples <b>{{ msg.payload.floatControl?.samples }}/{{ msg.payload.floatControl?.required }}</b></div><div>Float CVL active <b>{{ msg.payload.floatControl?.active ? 'YES' : 'NO' }}</b></div><div>Exit qualification <b>{{ msg.payload.exitQualification?.samples }}/{{ msg.payload.exitQualification?.required }}</b></div><div>Normal CCL policy <b>{{ number(msg.payload.normalCurrentPolicy?.value, 1) }} A · {{ msg.payload.normalCurrentPolicy?.source || '—' }}</b></div></div></section>

    <section><h3>Battery eligibility</h3><div class="grid" v-if="msg.payload.excludedBatteries?.length"><div v-for="battery in msg.payload.excludedBatteries" :key="battery.address">Battery {{ battery.address }} · spread {{ mv(battery.spread) }} · MOSFET {{ battery.mosfetOn ? 'ON' : 'OFF' }} · protection {{ battery.protected ? 'ACTIVE' : 'clear' }}<template v-if="battery.isMaster"> · CID2 61 {{ battery.system61Valid ? 'valid' : 'invalid' }}</template></div></div><p v-else>No batteries excluded.</p></section>

    <section><h3>Live graphs</h3><div class="charts"><div><h4>Selected and total current</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line total" :points="points('positiveTotalCurrent', 0, 20)"/><polyline class="line selected" :points="points('selectedCurrent', 0, 5)"/><line class="target" x1="0" :y1="y(msg.payload.config.balanceBatteryCurrentTarget,0,5)" x2="300" :y2="y(msg.payload.config.balanceBatteryCurrentTarget,0,5)"/></svg><small>Blue: positive total · orange: selected · dashed: 2 A target</small></div><div><h4>Selected Vmin / Vmax</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line vmax" :points="points('selectedVmax',3.0,3.7)"/><polyline class="line vmin" :points="points('selectedVmin',3.0,3.7)"/></svg><small>Addressed CID2 61 only</small></div><div><h4>Selected spread</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line spread" :points="points('selectedSpread',0,0.1)"/><line class="target" x1="0" :y1="y(msg.payload.config.balancerSpreadThreshold,0,0.1)" x2="300" :y2="y(msg.payload.config.balancerSpreadThreshold,0,0.1)"/></svg><small>Dashed: 30 mV selection threshold</small></div></div></section>

    <section><h3>Controls</h3><div class="control-row"><v-switch color="primary" hide-details label="Automatic balancing" :model-value="msg.payload.automaticBalancingEnabled" @update:model-value="setAutomaticBalancing"></v-switch><span>{{ msg.payload.automaticBalancingEnabled ? 'Eligible batteries are selected automatically.' : 'Controller remains in NORMAL and requests the Cerbo Charge Control limits.' }}</span></div><div class="buttons"><v-btn size="small" @click="sendControl('reset_integrator')">Reset control</v-btn><v-btn size="small" color="warning" @click="restoreDefaults">Restore defaults</v-btn></div><small>The Cerbo battery-monitor selector alone determines whether virtual-BMS requests are applied or remain shadow diagnostics.</small></section>
    <section><h3>CSV logging</h3><div class="buttons"><v-btn size="small" :color="msg.payload.csvLogging?.enabled ? 'error' : 'primary'" @click="toggleCsv">{{ msg.payload.csvLogging?.enabled ? 'Stop CSV logging' : 'Start CSV logging' }}</v-btn></div><small>{{ msg.payload.csvLogging?.enabled ? `Writing ${msg.payload.csvLogging.filename}` : 'Writes each valid eight-second telemetry sample.' }}</small></section>

    <section><h3>Configuration</h3><p>Active Ki: <b>{{ number(msg.payload.config.ki, 3) }}</b> A/(A·s) · unsaved edits are protected from telemetry refresh.</p><div class="form"><label>Spread threshold mV<input type="number" step="1" :value="mvNumber(cfg.balancerSpreadThreshold)" @input="setMv('balancerSpreadThreshold',$event)"></label><label>Selected target A<input type="number" step="0.1" v-model.number="cfg.balanceBatteryCurrentTarget" @input="markDirty"></label><label>Feed-forward EWMA<input type="number" step="0.01" v-model.number="cfg.feedForwardAlpha" @input="markDirty"></label><label>Feed-forward gain<input type="number" min="0" max="1" step="0.01" v-model.number="cfg.feedForwardGain" @input="markDirty"></label><label>Kp<input type="number" step="0.01" v-model.number="cfg.kp" @input="markDirty"></label><label>Ki<input type="number" step="0.001" v-model.number="cfg.ki" @input="markDirty"></label><label>Integral limit A<input type="number" step="1" v-model.number="cfg.maxIntegralTerm" @input="markDirty"></label><label>Aggregate maximum A<input type="number" step="1" v-model.number="cfg.aggregateCurrentMaximum" @input="markDirty"></label><label>Upward slew A/min<input type="number" step="1" v-model.number="cfg.currentIncreaseRatePerMin" @input="markDirty"></label><label>Solar tolerance A<input type="number" step="0.1" v-model.number="cfg.solarShortfallTolerance" @input="markDirty"></label><label>Solar samples<input type="number" step="1" v-model.number="cfg.solarDetectionSamples" @input="markDirty"></label><label>Qualification samples<input type="number" min="1" step="1" v-model.number="cfg.qualificationSamples" @input="markDirty"></label><label>Balancing CVL V<input type="number" step="0.1" v-model.number="cfg.balancingVoltageCeiling" @input="markDirty"></label><label>Safety CVL V<input type="number" step="0.1" v-model.number="cfg.safetyFallbackVoltage" @input="markDirty"></label><label>Safety CCL A<input type="number" step="0.1" v-model.number="cfg.safetyFallbackCurrent" @input="markDirty"></label><label>Telemetry freshness s<input type="number" step="1" :value="cfg.telemetryStaleMs/1000" @input="setSeconds('telemetryStaleMs',$event)"></label></div><div class="notice bad" v-if="configErrors.length">{{ configErrors.join('; ') }}</div><div class="buttons"><v-btn size="small" color="primary" :disabled="!configDirty || configPending" :loading="configPending" @click="applyConfig">Apply</v-btn><v-btn size="small" :disabled="!configDirty || configPending" @click="discardConfig">Discard changes</v-btn></div></section>
  </div>
</template>
<script>
export default {
  data () { return { cfg: {}, configDirty: false, configPending: false, pendingRequestId: null, configErrors: [] } },
  watch: { msg: { immediate: true, deep: true, handler (value) { const active=value?.payload?.config; const result=value?.payload?.configurationResult; if(result && this.configPending && String(result.requestId)===String(this.pendingRequestId)){ this.configPending=false; if(result.accepted){ this.configDirty=false; this.configErrors=[]; if(active)this.cfg={...active} } else this.configErrors=Array.isArray(result.errors)?result.errors:['Configuration rejected']; this.pendingRequestId=null; return } if(active && !this.configDirty && !this.configPending)this.cfg={...active} } } },
  methods: {
    number (value, digits = 2) { return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : '—' },
    integer (value) { return Number.isInteger(value) ? value : '—' },
    percent (value) { return typeof value === 'number' && Number.isFinite(value) ? `${(value * 100).toFixed(1)} %` : '—' },
    mv (value) { return typeof value === 'number' && Number.isFinite(value) ? `${(value * 1000).toFixed(1)} mV` : '—' },
    mvNumber (value) { return typeof value === 'number' && Number.isFinite(value) ? (value * 1000).toFixed(1) : '' },
    entryProgress (items) { return Array.isArray(items) && items.length ? items.map(item => `B${item.address} ${item.samples}/${item.required}`).join(' · ') : 'No active candidates' },
    markDirty () { this.configDirty = true; this.configErrors = [] },
    setMv (field, event) { this.cfg[field] = Number(event.target.value) / 1000; this.markDirty() },
    setSeconds (field, event) { this.cfg[field] = Number(event.target.value) * 1000; this.markDirty() },
    history () { return Array.isArray(this.msg?.payload?.history) ? this.msg.payload.history : [] },
    y (value, min, max) { const ratio = Math.max(0, Math.min(1, (value - min) / (max - min))); return 100 - ratio * 100 },
    points (field, min, max) { const values = this.history(); const denominator = Math.max(1, values.length - 1); return values.map((item,index) => typeof item[field] === 'number' && Number.isFinite(item[field]) ? `${index/denominator*300},${this.y(item[field],min,max)}` : null).filter(Boolean).join(' ') },
    sendControl (type, value) { const payload = { type }; if (value !== undefined) payload.value = value; this.send({ topic: 'controller_control', payload }) },
    setAutomaticBalancing (value) { this.sendControl('set_automatic_balancing', value === true) },
    restoreDefaults () { if (window.confirm('Restore controller defaults and turn automatic balancing ON?')) this.sendControl('restore_defaults') },
    applyConfig () { if(!this.configDirty||this.configPending)return; const requestId=`cfg-${Date.now()}-${Math.random().toString(16).slice(2)}`; this.pendingRequestId=requestId; this.configPending=true; this.configErrors=[]; this.send({ topic:'controller_control', payload:{ type:'configure', requestId, config:{...this.cfg} } }) },
    discardConfig () { if(this.msg?.payload?.config)this.cfg={...this.msg.payload.config}; this.configDirty=false; this.configPending=false; this.pendingRequestId=null; this.configErrors=[] },
    toggleCsv () { const active = this.msg?.payload?.csvLogging?.enabled; if (active) return this.send({ topic:'controller_control', payload:{ type:'set_csv_logging', value:false } }); const suggested=`dyness-balancer-${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.csv`; const filename=window.prompt('CSV filename',suggested); if(filename)this.send({topic:'controller_control',payload:{type:'set_csv_logging',value:true,filename}}) }
  }
}
</script>
<style>
.controller{font-size:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2,.controller h3,.controller h4{margin:0 0 8px}.head p,.controller p,small{margin:0;color:rgba(0,0,0,.65)}.badge{border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}.good{background:#d9f4df;color:#176b35}.neutral{background:#e5e5e5;color:#555}.bad{background:#f9dddd;color:#9d2727}.cards,.charts,.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.card,section{border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:12px;background:rgba(255,255,255,.55)}.card{display:flex;flex-direction:column;gap:4px}.card b{font-size:18px}.notice{margin:12px 0;padding:10px;border-radius:6px;background:#fff1cf;color:#6b4e00}.grid,.buttons{display:flex;flex-wrap:wrap;gap:10px}.control-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}.grid>div{padding:7px;background:rgba(0,0,0,.04);border-radius:5px}.charts>div{min-width:0}.charts svg{width:100%;height:120px;background:#fbfbfb;border:1px solid #ddd}.line{fill:none;stroke-width:2}.total{stroke:#1976d2}.selected{stroke:#ef6c00}.vmax{stroke:#d32f2f}.vmin{stroke:#2e7d32}.spread{stroke:#7b1fa2}.target{stroke:#777;stroke-dasharray:5 4;stroke-width:1}.form label{display:flex;flex-direction:column;gap:4px;font-weight:600}.form input{border:1px solid #aaa;border-radius:4px;padding:6px;background:white}.buttons{margin:8px 0}
</style>
