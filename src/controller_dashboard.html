<template>
  <div class="controller" v-if="msg?.payload">
    <div class="head"><div><h2>Dyness balancing controller</h2><p>{{ msg.payload.activeBms?.label || 'BMS source unknown' }} · physical authority is selected manually in Cerbo.</p></div><span class="badge" :class="msg.payload.state === 'SAFETY_STOP' ? 'bad' : msg.payload.enabled ? 'good' : 'neutral'">{{ msg.payload.mode }} · {{ msg.payload.state }}</span></div>
    <div class="cards">
      <div class="card"><span>Selected battery</span><b>{{ msg.payload.selectedAddress ?? '—' }}</b><small>{{ msg.payload.selectedReason || 'No selection' }}</small></div>
      <div class="card"><span>Selected SOC</span><b>{{ integer(msg.payload.selectedSoc) }} %</b><small>Addressed CID2 61 integer</small></div>
      <div class="card"><span>Selected Vmin / Vmax</span><b>{{ number(msg.payload.selectedVmin, 3) }} / {{ number(msg.payload.selectedVmax, 3) }} V</b><small>Spread {{ mv(msg.payload.selectedSpread) }} · addressed CID2 61</small></div>
      <div class="card"><span>Selected current</span><b>{{ number(msg.payload.selectedCurrent, 2) }} A</b><small>Target {{ number(msg.payload.config.balanceBatteryCurrentTarget, 2) }} A</small></div>
      <div class="card"><span>Positive total current</span><b>{{ number(msg.payload.positiveTotalCurrent, 2) }} A</b><small>No equal-sharing assumption</small></div>
      <div class="card"><span>Aggregate request</span><b>{{ number(msg.payload.aggregateCurrentCommand, 2) }} A</b><small>{{ msg.payload.lastCommand?.reason || '—' }}</small></div>
      <div class="card"><span>Full-SOC completion</span><b>{{ msg.payload.completionLatched ? 'LATCHED' : 'ARMED' }}</b><small>Permission OFF observed: {{ msg.payload.permissionOffSeen ? 'yes' : 'no' }}</small></div>
      <div class="card"><span>Solar limitation</span><b>{{ msg.payload.solarLimited ? 'PAUSED' : 'CLEAR' }}</b><small>Enter {{ msg.payload.solarDeficitSamples }}/{{ msg.payload.config.solarDetectionSamples }} · recover {{ msg.payload.solarRecoverySamples }}/{{ msg.payload.config.solarDetectionSamples }}</small></div>
    </div>
    <div class="notice" v-if="msg.payload.lockout || msg.payload.fault">{{ msg.payload.fault || msg.payload.lockout }}</div>

    <section><h3>Feed-forward and slow PI</h3><div class="grid"><div>Raw selected share <b>{{ percent(msg.payload.rawSelectedShare) }}</b></div><div>Filtered share <b>{{ percent(msg.payload.filteredSelectedShare) }}</b></div><div>Feed-forward <b>{{ number(msg.payload.feedForwardCurrent, 2) }} A</b></div><div>P term <b>{{ number(msg.payload.pTerm, 3) }} A</b></div><div>I term <b>{{ number(msg.payload.iTerm, 3) }} A</b></div><div>Effective CCL <b>{{ number(msg.payload.virtualBms?.effectiveChargeCurrent, 2) }} A</b></div><div>Effective discharging <b>{{ msg.payload.selectedEffectiveDischarging ? 'ON' : 'OFF' }}</b></div></div></section>

    <section><h3>Virtual BMS / DVCC arbitration</h3><div class="grid"><div>Requested CVL <b>{{ number(msg.payload.virtualBms?.requestedVoltage, 2) }} V</b></div><div>Effective CVL <b>{{ number(msg.payload.virtualBms?.effectiveChargeVoltage, 2) }} V</b></div><div>BMS CVL <b>{{ number(msg.payload.virtualBms?.bmsChargeVoltage, 2) }} V</b></div><div>Requested CCL <b>{{ number(msg.payload.virtualBms?.requestedCurrent, 2) }} A</b></div><div>Effective CCL <b>{{ number(msg.payload.virtualBms?.effectiveChargeCurrent, 2) }} A</b></div><div>BMS CCL <b>{{ number(msg.payload.virtualBms?.bmsChargeCurrent, 2) }} A</b></div><div>Thermal factor <b>{{ number(msg.payload.virtualBms?.thermalFactor, 3) }}</b></div><div>Charge permission <b>{{ msg.payload.virtualBms?.statusFlags?.chargeEnabled === true ? 'ON' : msg.payload.virtualBms?.statusFlags?.chargeEnabled === false ? 'OFF' : '—' }}</b></div></div><p>{{ msg.payload.virtualBms?.reason || 'No arbitration output' }} · {{ msg.payload.virtualBms?.mode || 'TEST' }}</p></section>

    <section><h3>Battery eligibility</h3><div class="grid" v-if="msg.payload.excludedBatteries?.length"><div v-for="battery in msg.payload.excludedBatteries" :key="battery.address">Battery {{ battery.address }} · spread {{ mv(battery.spread) }} · MOSFET {{ battery.mosfetOn ? 'ON' : 'OFF' }} · protection {{ battery.protected ? 'ACTIVE' : 'clear' }} · CID2 61 {{ battery.system61Valid ? 'valid' : 'invalid' }}</div></div><p v-else>No batteries excluded.</p></section>

    <section><h3>Live graphs</h3><div class="charts"><div><h4>Selected and total current</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line total" :points="points('positiveTotalCurrent', 0, 20)"/><polyline class="line selected" :points="points('selectedCurrent', 0, 5)"/><line class="target" x1="0" :y1="y(msg.payload.config.balanceBatteryCurrentTarget,0,5)" x2="300" :y2="y(msg.payload.config.balanceBatteryCurrentTarget,0,5)"/></svg><small>Blue: positive total · orange: selected · dashed: 2 A target</small></div><div><h4>Selected Vmin / Vmax</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line vmax" :points="points('selectedVmax',3.0,3.7)"/><polyline class="line vmin" :points="points('selectedVmin',3.0,3.7)"/></svg><small>Addressed CID2 61 only</small></div><div><h4>Selected spread</h4><svg viewBox="0 0 300 100" preserveAspectRatio="none"><polyline class="line spread" :points="points('selectedSpread',0,0.1)"/><line class="target" x1="0" :y1="y(msg.payload.config.balancerSpreadThreshold,0,0.1)" x2="300" :y2="y(msg.payload.config.balancerSpreadThreshold,0,0.1)"/></svg><small>Dashed: 30 mV selection threshold</small></div></div></section>

    <section><h3>Controls</h3><div class="buttons"><v-btn size="small" color="primary" @click="sendControl('set_enabled',true)">Enable</v-btn><v-btn size="small" @click="sendControl('set_enabled',false)">Disable</v-btn><v-btn size="small" @click="sendControl('manual_start')">Start balancing</v-btn><v-btn size="small" @click="sendControl('manual_stop')">Stop balancing</v-btn><v-btn size="small" @click="sendControl('reset_integrator')">Reset control</v-btn></div></section>
    <section><h3>CSV logging</h3><div class="buttons"><v-btn size="small" :color="msg.payload.csvLogging?.enabled ? 'error' : 'primary'" @click="toggleCsv">{{ msg.payload.csvLogging?.enabled ? 'Stop CSV logging' : 'Start CSV logging' }}</v-btn></div><small>{{ msg.payload.csvLogging?.enabled ? `Writing ${msg.payload.csvLogging.filename}` : 'Writes each valid eight-second telemetry sample.' }}</small></section>

    <section><h3>Configuration</h3><div class="form"><label>Spread threshold mV<input type="number" step="1" :value="mvNumber(cfg.balancerSpreadThreshold)" @input="cfg.balancerSpreadThreshold=Number($event.target.value)/1000"></label><label>Selected target A<input type="number" step="0.1" v-model.number="cfg.balanceBatteryCurrentTarget"></label><label>Feed-forward EWMA<input type="number" step="0.01" v-model.number="cfg.feedForwardAlpha"></label><label>Kp<input type="number" step="0.01" v-model.number="cfg.kp"></label><label>Ki<input type="number" step="0.001" v-model.number="cfg.ki"></label><label>Integral limit A<input type="number" step="1" v-model.number="cfg.maxIntegralTerm"></label><label>Aggregate maximum A<input type="number" step="1" v-model.number="cfg.aggregateCurrentMaximum"></label><label>Upward slew A/min<input type="number" step="1" v-model.number="cfg.currentIncreaseRatePerMin"></label><label>Solar tolerance A<input type="number" step="0.1" v-model.number="cfg.solarShortfallTolerance"></label><label>Solar samples<input type="number" step="1" v-model.number="cfg.solarDetectionSamples"></label><label>Balancing CVL V<input type="number" step="0.1" v-model.number="cfg.balancingVoltageCeiling"></label><label>Safety CVL V<input type="number" step="0.1" v-model.number="cfg.safetyFallbackVoltage"></label><label>Safety CCL A<input type="number" step="0.1" v-model.number="cfg.safetyFallbackCurrent"></label><label>Telemetry freshness s<input type="number" step="1" :value="cfg.telemetryStaleMs/1000" @input="cfg.telemetryStaleMs=Number($event.target.value)*1000"></label></div><v-btn size="small" color="primary" @click="applyConfig">Validate and apply</v-btn></section>
  </div>
</template>
<script>
export default {
  data () { return { cfg: {} } },
  watch: { msg: { immediate: true, deep: true, handler (value) { if (value?.payload?.config) this.cfg = { ...value.payload.config } } } },
  methods: {
    number (value, digits = 2) { return typeof value === 'number' && Number.isFinite(value) ? value.toFixed(digits) : '—' },
    integer (value) { return Number.isInteger(value) ? value : '—' },
    percent (value) { return typeof value === 'number' && Number.isFinite(value) ? `${(value * 100).toFixed(1)} %` : '—' },
    mv (value) { return typeof value === 'number' && Number.isFinite(value) ? `${(value * 1000).toFixed(1)} mV` : '—' },
    mvNumber (value) { return typeof value === 'number' && Number.isFinite(value) ? (value * 1000).toFixed(1) : '' },
    history () { return Array.isArray(this.msg?.payload?.history) ? this.msg.payload.history : [] },
    y (value, min, max) { const ratio = Math.max(0, Math.min(1, (value - min) / (max - min))); return 100 - ratio * 100 },
    points (field, min, max) { const values = this.history(); const denominator = Math.max(1, values.length - 1); return values.map((item,index) => typeof item[field] === 'number' && Number.isFinite(item[field]) ? `${index/denominator*300},${this.y(item[field],min,max)}` : null).filter(Boolean).join(' ') },
    sendControl (type, value) { const payload = { type }; if (value !== undefined) payload.value = value; this.send({ topic: 'controller_control', payload }) },
    applyConfig () { this.send({ topic: 'controller_control', payload: { type: 'configure', config: this.cfg } }) },
    toggleCsv () { const active = this.msg?.payload?.csvLogging?.enabled; if (active) return this.send({ topic:'controller_control', payload:{ type:'set_csv_logging', value:false } }); const suggested=`dyness-balancer-${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.csv`; const filename=window.prompt('CSV filename',suggested); if(filename)this.send({topic:'controller_control',payload:{type:'set_csv_logging',value:true,filename}}) }
  }
}
</script>
<style>
.controller{font-size:14px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.head h2,.controller h3,.controller h4{margin:0 0 8px}.head p,.controller p,small{margin:0;color:rgba(0,0,0,.65)}.badge{border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}.good{background:#d9f4df;color:#176b35}.neutral{background:#e5e5e5;color:#555}.bad{background:#f9dddd;color:#9d2727}.cards,.charts,.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.card,section{border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:12px;background:rgba(255,255,255,.55)}.card{display:flex;flex-direction:column;gap:4px}.card b{font-size:18px}.notice{margin:12px 0;padding:10px;border-radius:6px;background:#fff1cf;color:#6b4e00}.grid,.buttons{display:flex;flex-wrap:wrap;gap:10px}.grid>div{padding:7px;background:rgba(0,0,0,.04);border-radius:5px}.charts>div{min-width:0}.charts svg{width:100%;height:120px;background:#fbfbfb;border:1px solid #ddd}.line{fill:none;stroke-width:2}.total{stroke:#1976d2}.selected{stroke:#ef6c00}.vmax{stroke:#d32f2f}.vmin{stroke:#2e7d32}.spread{stroke:#7b1fa2}.target{stroke:#777;stroke-dasharray:5 4;stroke-width:1}.form label{display:flex;flex-direction:column;gap:4px;font-weight:600}.form input{border:1px solid #aaa;border-radius:4px;padding:6px;background:white}.buttons{margin-top:8px}
</style>
